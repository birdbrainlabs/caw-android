[versions]
agp = "8.7.3"
kotlin = "2.0.21"
# sherpa-onnx: see the note in app/build.gradle.kts about where this artifact comes from.
sherpaOnnx = "1.12.0"
junit = "4.13.2"
orgJson = "20240303"
webkit = "1.12.1"
zxingEmbedded = "4.3.0"

[libraries]
sherpa-onnx = { module = "com.k2-fsa:sherpa-onnx", version.ref = "sherpaOnnx" }
junit = { module = "junit:junit", version.ref = "junit" }
org-json = { module = "org.json:json", version.ref = "orgJson" }
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "webkit" }
zxing-android-embedded = { module = "com.journeyapps:zxing-android-embedded", version.ref = "zxingEmbedded" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
